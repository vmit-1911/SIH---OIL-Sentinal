version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oil-sif-sentinel-app
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DEBUG=true
      - LOG_LEVEL=INFO
      - LOG_FORMAT=JSON
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/oil_sif_db
      - DATABASE_URL_SYNC=postgresql://postgres:postgres@db:5432/oil_sif_db
      - CORS_ALLOWED_ORIGINS=*
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    container_name: oil-sif-sentinel-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=oil_sif_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oil_sif_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
